# dvc.yaml – pipeline definition.
# Stages are filled in phase-by-phase. Skeleton shown here so dvc repro
# is valid from Phase 0 onward (no-op stages until implemented).

stages:
  ingest:
    cmd: python -m aqforecast.ingest --mode incremental
    deps:
      - src/aqforecast/ingest.py
      - configs/config.yaml
    params:
      - configs/config.yaml:
          - ingestion.incremental_days
          - ingestion.archive_lag_days
    outs:
      - data/raw/

  validate:
    cmd: python -m aqforecast.validate
    deps:
      - src/aqforecast/validate.py
      - configs/config.yaml
      - data/raw/
    outs:
      - data/processed/validated/

  features:
    cmd: python -m aqforecast.features
    deps:
      - src/aqforecast/features.py
      - configs/config.yaml
      - data/processed/validated/
    params:
      - configs/config.yaml:
          - features
          - horizon
    outs:
      - data/processed/features/

  train:
    cmd: python -m aqforecast.train
    deps:
      - src/aqforecast/train.py
      - configs/config.yaml
      - data/processed/features/
    params:
      - params.yaml:
          - split
          - xgboost
          - mlflow
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/challenger_run_id.txt:
          cache: false

  evaluate:
    cmd: python -m aqforecast.evaluate
    deps:
      - src/aqforecast/evaluate.py
      - configs/config.yaml
      - data/processed/features/
      - reports/challenger_run_id.txt
    metrics:
      - reports/evaluation.json:
          cache: false

  promote:
    cmd: python -m aqforecast.promote
    deps:
      - src/aqforecast/promote.py
      - data/processed/features/features.parquet
      - reports/challenger_run_id.txt
      - reports/evaluation.json
    params:
      - params.yaml:
          - mlflow
      - configs/config.yaml:
          - promotion
    outs:
      - reports/promotion_decision.json:
          cache: false

  monitor:
    cmd: python -m aqforecast.monitor
    deps:
      - src/aqforecast/monitor.py
      - data/processed/features/features.parquet
      - reports/promotion_decision.json
    params:
      - configs/config.yaml:
          - monitoring
    outs:
      - reports/data_drift.html:
          cache: false
      - reports/data_drift.json:
          cache: false
      - reports/prediction_drift.html:
          cache: false
      - reports/prediction_drift.json:
          cache: false
      - reports/live_metrics.json:
          cache: false

