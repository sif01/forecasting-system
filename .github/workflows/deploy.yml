name: Build and Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Validate deployment target
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          if [[ "$DEPLOY_TARGET" != "render" && "$DEPLOY_TARGET" != "cloud-run" ]]; then
            echo "::error title=Invalid deployment target::Set the repository variable DEPLOY_TARGET to exactly 'render' or 'cloud-run'."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.image.outputs.name }}

  deploy-render:
    if: ${{ vars.DEPLOY_TARGET == 'render' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl --fail --retry 5 --retry-delay 10 -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Smoke test deployed service
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent "$RENDER_URL/health"; then break; fi
            sleep 10
          done
          curl --fail "$RENDER_URL/health"
          status=$(curl --silent --show-error --output predict-response.json --write-out '%{http_code}' \
            -X POST "$RENDER_URL/predict" -H 'Content-Type: application/json' -d '{}')
          if [[ "$status" == "503" ]]; then
            if grep -q "Champion model is not loaded" predict-response.json; then
              echo "::error title=No champion model::Render returned 503 because no champion model is loaded. Check the first retrain promotion decision and confirm MLflow has a champion alias."
            else
              echo "::error title=Render API unavailable::POST /predict returned HTTP 503. Inspect the response and Render service logs."
            fi
            cat predict-response.json
            exit 1
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error title=Render prediction smoke test failed::POST /predict returned HTTP $status."
            cat predict-response.json
            exit 1
          fi
          cat predict-response.json
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}

  deploy-cloud-run:
    if: ${{ vars.DEPLOY_TARGET == 'cloud-run' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |
            MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}
            MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}
            MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}
            AQ_ADMIN_TOKEN=${{ secrets.API_RELOAD_SECRET }}
      - name: Smoke test deployed service
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          curl --fail "$URL/health"
          curl --fail -X POST "$URL/predict" -H 'Content-Type: application/json' -d '{}'
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          REGION: ${{ vars.CLOUD_RUN_REGION }}
