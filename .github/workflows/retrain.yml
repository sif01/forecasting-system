name: Daily Retrain

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  retrain:
    name: Ingest, validate, train, promote, and monitor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      AQ_ADMIN_TOKEN: ${{ secrets.API_RELOAD_SECRET }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure DagsHub DVC credentials
        run: |
          dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"
      - uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ github.ref }}
          restore-keys: dvc-${{ runner.os }}-
      - name: Pull versioned data
        run: dvc pull
      - name: Run complete pipeline
        run: dvc repro
      - name: Push versioned data
        run: dvc push
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Open data and pipeline update PR
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/daily-retrain
          delete-branch: true
          commit-message: "chore: update daily retraining data pointers"
          title: "chore: daily retraining data and pipeline update"
          body: |
            Automated daily data refresh and DVC pipeline run.

            - [x] Ingested and validated new observations
            - [x] Trained and evaluated candidate model
            - [x] Ran promotion gate and drift monitoring
            - [x] Pushed DVC data to DagsHub
