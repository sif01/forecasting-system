# params.yaml – all tunables that DVC tracks for experiment reproducibility.
# Changes here invalidate downstream stages and trigger a dvc repro.

# ── Data split ─────────────────────────────────────────────────────────────
split:
  # Fraction of data used for training (chronological)
  train_frac: 0.70
  # Fraction used for validation (next block after train)
  val_frac: 0.15
  # Remainder is test set

# ── XGBoost hyperparameters ────────────────────────────────────────────────
xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.0
  reg_alpha: 0.1
  reg_lambda: 1.0
  # Fix seed for full reproducibility
  random_state: 42
  n_jobs: -1
  objective: reg:squarederror
  eval_metric: mae

# ── MLflow ─────────────────────────────────────────────────────────────────
mlflow:
  experiment_name: aq-forecast-bangalore
  registered_model_name: aq-forecast-pm25
